[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiter-finder"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "twilio>=9,<10", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
recruiter = "recruiter.cli:main"

[tool.setuptools.packages.find]
include = ["recruiter*"]
