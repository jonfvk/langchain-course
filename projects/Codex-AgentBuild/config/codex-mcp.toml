# Staged template: not loaded automatically. Keep disabled until authorized.
[mcp_servers.tastytrade_sandbox]
enabled = false
command = "/bin/sh"
args = ["scripts/tastytrade-mcp-readonly.sh"]
cwd = "/path/to/Codex-AgentBuild"
env_vars = ["TASTYTRADE_CLIENT_ID", "TASTYTRADE_CLIENT_SECRET", "TASTYTRADE_REFRESH_TOKEN"]

[mcp_servers.tastytrade_sandbox.env]
TASTYTRADE_ENV = "sandbox"
TASTYTRADE_READ_ONLY = "1"
